/* ============================================================
   PROPOSTA ÁGIL SOLAR — PDF PARA IMPRIMIR (A4 DEITADO, 10 FOLHAS)
   Modelo aprovado em 27/10/2026 (outputs/mockups/proposta-ongrid).
   Só cores da marca; nada encosta na borda, exceto a capa.
   Para o html2canvas: sem object-fit (fotos são fundo "cover") e
   textos importantes em HTML, não dentro de SVG.
   ============================================================ */
@page { size: A4 landscape; margin: 0; }
:root{
  --azul:#008FD4; --azul-txt:#0072AA; --azul-claro:#E5F3FB; --azul-medio:#8ACDEE;
  --laranja:#FAA519; --laranja-claro:#FFF3DC; --laranja-txt:#8A5600;
  --cinza:#808284; --tinta:#0F2533; --texto:#3A4753; --suave:#6B7883;
  --linha:#E2E8EE; --fundo:#F4F7FA;
  --f-marca:'Montserrat',sans-serif; --f-texto:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#C9D3DC;font-family:var(--f-texto);color:var(--texto);font-size:10pt;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding-bottom:90px}
h1,h2,h3{font-family:var(--f-marca);color:var(--tinta);margin:0;letter-spacing:-.01em}
p{margin:0}
.num{font-family:var(--f-marca);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--tinta)}
.num small{font-size:.5em;font-weight:700;letter-spacing:0;margin-left:.15em;color:var(--suave)}
.num .rs{font-size:.5em;font-weight:700;letter-spacing:0;margin-right:.2em;vertical-align:.55em;color:inherit}

.pg{width:297mm;height:210mm;margin:8mm auto;background:#fff;position:relative;overflow:hidden;
  padding:12mm 16mm 10mm;display:flex;flex-direction:column;box-shadow:0 6px 30px rgba(15,37,51,.18);page-break-after:always;break-after:page}
.topo{display:flex;align-items:center;justify-content:space-between;padding-bottom:5mm;border-bottom:1px solid var(--linha)}
.topo img{height:8.5mm;display:block}
.topo .ref{font-size:8pt;color:var(--suave);text-align:right;line-height:1.35}
.topo .ref b{color:var(--tinta);font-weight:700}
.corpo{flex:1;display:flex;flex-direction:column;padding:7mm 0 6mm;min-height:0}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:8mm;padding-top:4mm;border-top:1px solid var(--linha);font-size:7.5pt;color:var(--suave)}
.rodape .pag{font-family:var(--f-marca);font-weight:800;color:var(--tinta);font-size:8.5pt;letter-spacing:.04em;white-space:nowrap}
.rodape .pag span{color:var(--cinza);font-weight:600}

.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10mm;margin-bottom:6mm}
.olho{display:flex;align-items:center;gap:2.5mm;font-size:8pt;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--azul-txt);margin-bottom:2mm}
.olho::before{content:"";width:7mm;height:1.6mm;border-radius:1mm;background:var(--laranja)}
.cab h2{font-size:22pt;font-weight:800;line-height:1.1}
.cab .lead{max-width:105mm;font-size:9.5pt;color:var(--suave);text-align:right}
.rot{font-size:7.5pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.miudo{font-size:7.5pt;color:var(--suave);line-height:1.4}
.ic{width:6mm;height:6mm;flex-shrink:0}
.sub-tit{font-family:var(--f-marca);font-weight:800;font-size:12pt;color:var(--tinta);margin:0 0 3.5mm;display:flex;align-items:center;gap:3mm}
.sub-tit::after{content:"";flex:1;height:1px;background:var(--linha)}

/* ---------- 1. Capa ---------- */
.capa{padding:0}
.capa svg.fundo-capa{position:absolute;inset:0;width:100%;height:100%}
.capa .conteudo{position:relative;height:100%;padding:16mm 18mm 12mm;display:flex;flex-direction:column}
.capa .marca{margin-top:30mm}
.capa .marca img{height:14mm;display:block}
.capa h1{font-family:var(--f-marca);font-weight:800;font-size:46pt;line-height:1;color:var(--laranja);letter-spacing:-.02em;margin-top:7mm}
.capa .traco{width:84mm;height:.7mm;background:var(--azul);margin-top:6mm;border-radius:1mm}
.capa .cliente{font-family:var(--f-marca);font-weight:800;font-size:19pt;color:var(--tinta);margin-top:7mm;max-width:150mm}
.capa .cidade{font-size:11pt;color:var(--suave);margin-top:1mm}
.capa .rodape-capa{margin-top:auto;display:flex;align-items:flex-end;gap:12mm}
.capa .dados{display:grid;grid-template-columns:auto auto auto auto;gap:0 9mm;font-size:8.5pt;color:var(--suave)}
.capa .dados b{display:block;color:var(--tinta);font-weight:700;font-size:10pt}
.capa .dados b.kwp{color:var(--azul-txt);font-family:var(--f-marca);font-weight:800;font-size:13pt}
.capa .redes{margin-left:auto;display:flex;gap:6mm;font-size:9pt;color:var(--tinta);font-weight:600}
.capa .redes span{display:flex;align-items:center;gap:1.8mm}
.capa .redes .ic{width:4.5mm;height:4.5mm;color:var(--azul)}

/* ---------- 2. Resumo: a conta de hoje × a conta com solar ---------- */
.ad{display:grid;grid-template-columns:84mm minmax(0,1fr);gap:11mm;align-items:center;flex:1;min-height:0}
.ad .eco-g{font-family:var(--f-marca);font-weight:900;font-size:52pt;color:var(--azul-txt);white-space:nowrap;line-height:1;letter-spacing:-.03em;margin-top:2mm}
.ad .eco-g .rs{font-size:18pt;vertical-align:24pt;margin-right:1.5mm;font-weight:800}
.ad .eco-l{font-size:11pt;color:var(--tinta);font-weight:700;margin-top:2mm}
.ad .eco-mais{display:grid;grid-template-columns:auto auto auto;justify-content:space-between;gap:5mm;margin-top:6mm;padding-top:4mm;border-top:1px solid var(--linha);font-size:8.5pt;color:var(--suave)}
.ad .eco-mais b{display:block;font-family:var(--f-marca);font-weight:800;color:var(--tinta);font-size:12pt;line-height:1.2;margin-top:.5mm}
.barras{display:flex;flex-direction:column;gap:8mm}
.barra .k{font-size:9pt;font-weight:800;color:var(--suave);margin-bottom:1.8mm;letter-spacing:.04em}
.trilho{position:relative;height:25mm}
.trilho .b{position:absolute;left:0;top:0;bottom:0;border-radius:3.5mm;display:flex;align-items:center;padding:0 5mm;font-family:var(--f-marca);font-weight:800;white-space:nowrap}
.trilho .hoje{width:100%;background:var(--laranja);color:var(--tinta);justify-content:center;gap:2.5mm;font-family:var(--f-texto);font-size:11.5pt;font-weight:700}
.trilho .hoje b{font-family:var(--f-marca);font-weight:800;font-size:19pt}
.trilho .solar{background:var(--azul);color:#fff;justify-content:center;font-size:15pt;padding:0 2mm}
.trilho .sobra{position:absolute;top:0;bottom:0;right:0;border:2.5px dashed var(--laranja);border-radius:3.5mm;display:flex;align-items:center;justify-content:center;gap:2.5mm;color:var(--laranja-txt);font-weight:800;font-size:11.5pt}
.trilho .sobra b{font-family:var(--f-marca);font-size:17pt;color:var(--tinta)}
.barras .miudo{margin-top:-2mm}
.sem-geracao{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:170mm}
.sem-geracao h3{font-size:20pt;line-height:1.2}
.sem-geracao p{font-size:11pt;margin-top:3mm;line-height:1.6}
.faixa-res{display:grid;grid-template-columns:1.3fr 1fr auto;border:1px solid var(--linha);border-radius:5mm;margin-top:6mm}
.faixa-res > div{padding:4.5mm 6mm;border-left:1px solid var(--linha);min-width:0}
.faixa-res > div:first-child{border-left:0}
.faixa-res .rot{margin-bottom:2.5mm}
.mini4{display:flex;justify-content:space-between;gap:4mm}
.mini4 .num{font-size:14pt;display:block}
.mini4 span.k{font-size:8pt;color:var(--suave)}
.faixa-res .preco{font-family:var(--f-marca);font-weight:900;font-size:24pt;color:var(--tinta);white-space:nowrap;line-height:1;letter-spacing:-.02em}
.faixa-res .preco .rs{font-size:10pt;vertical-align:10pt;margin-right:1mm;font-weight:800}
.faixa-res .de{font-size:8.5pt;color:var(--suave);text-decoration:line-through;margin-left:2mm;font-weight:500;letter-spacing:0;text-transform:none}
.faixa-res .ou{font-size:8.5pt;color:var(--suave);margin-top:1.5mm}
.faixa-res .ou b{color:var(--tinta)}
.qr-p{display:flex;gap:3mm;align-items:center;font-size:8pt;line-height:1.35;color:var(--suave);max-width:52mm}
.qr-p .box{width:21mm;height:21mm;padding:1.5mm;border:1px solid var(--linha);border-radius:2mm;flex-shrink:0}
.qr-p .box img{width:100%;height:100%;display:block;image-rendering:pixelated}
.qr-p b{display:block;color:var(--tinta);font-size:9pt}

/* ---------- 3. Quem somos: números grandes + fotos dos clientes ---------- */
.numeros-faixa{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:4mm 0}
.numeros-faixa div{padding:0 6mm;border-left:1px solid var(--linha)}
.numeros-faixa div:first-child{border-left:0;padding-left:0}
.numeros-faixa .num{font-size:30pt;color:var(--azul-txt);display:block;line-height:1.05}
.numeros-faixa span.k{font-size:9pt;color:var(--suave);font-weight:600}
.fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5mm;flex:1;min-height:0;margin-top:6mm}
.foto-caso{position:relative;display:flex;flex-direction:column;min-height:0}
.foto-caso .ft{flex:1;min-height:0;border-radius:5mm;background-size:cover;background-position:center}
.foto-caso .depo{position:relative;margin:-16mm 4mm 0;background:#fff;border-radius:4mm;padding:4mm 4.5mm;box-shadow:0 4px 16px rgba(15,37,51,.14)}
.foto-caso .estrelas{color:var(--laranja);font-size:10.5pt;letter-spacing:1px;line-height:1}
.foto-caso h3{font-size:10pt;font-weight:800;margin:1.5mm 0 1mm}
.foto-caso p{font-size:8.5pt;line-height:1.45;font-style:italic}

/* ---------- 4. Seu projeto ---------- */
.proj{display:grid;grid-template-columns:80mm minmax(0,1fr);gap:9mm;flex:1;min-height:0;align-items:center}
.cobre .pct{font-family:var(--f-marca);font-weight:900;font-size:56pt;line-height:1;color:var(--azul-txt);letter-spacing:-.03em;margin-top:2mm;white-space:nowrap}
.cobre .pct small{font-size:16pt;font-weight:800;letter-spacing:0;margin-left:1.5mm}
.cobre .pct-l{font-size:11.5pt;font-weight:700;color:var(--tinta);margin-top:2mm;line-height:1.35}
.cobre .comp{margin-top:6mm;padding-top:4mm;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:3mm}
.cobre .comp div{display:flex;align-items:center;gap:3mm;font-size:9pt;color:var(--suave)}
.cobre .comp b{margin-left:auto;font-family:var(--f-marca);font-weight:800;font-size:13pt;color:var(--tinta);white-space:nowrap}
.cobre .comp i{width:9mm;height:3.2mm;border-radius:1mm;background:var(--azul);flex-shrink:0}
.cobre .comp i.lar{height:0;border-top:3px dashed var(--laranja);border-radius:0;background:none}
.graf4{height:100%;min-height:0;display:flex}
.graf4 svg{width:100%;height:100%}
.ficha6{display:flex;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:3.5mm 0;margin-top:5mm}
.ficha6 div{flex:1;padding:0 4mm;border-left:1px solid var(--linha);min-width:0}
.ficha6 div:first-child{border-left:0;padding-left:0}
.ficha6 span.k{display:flex;gap:1.8mm;align-items:center;font-size:7.8pt;color:var(--suave);font-weight:700}
.ficha6 span.k .ic{width:4.2mm;height:4.2mm;color:var(--azul)}
.ficha6 b{display:block;color:var(--tinta);font-size:9.5pt;margin-top:1mm;line-height:1.25}
.eco-b{margin-top:5mm;background:var(--azul);border-radius:4mm;color:#fff;padding:4mm 7mm;display:grid;grid-template-columns:auto repeat(3,1fr);gap:8mm;align-items:center}
.eco-b .tit{font-family:var(--f-marca);font-weight:800;font-size:11pt;line-height:1.25}
.eco-b .tit span{display:block;font-family:var(--f-texto);font-weight:600;font-size:8pt;opacity:.85;margin-top:.8mm}
.eco-b .it{display:flex;gap:3.5mm;align-items:center}
.eco-b .it .ic{width:9mm;height:9mm;color:#fff}
.eco-b .num{color:#fff;font-size:17pt;display:block;line-height:1.1}
.eco-b span.k{font-size:8.3pt;opacity:.9}

/* ---------- 5. Como funciona: cena com números e legendas por cima ---------- */
.cena5{display:grid;grid-template-columns:158mm minmax(0,1fr);gap:8mm;flex:1;min-height:0;align-items:start}
.cena{position:relative;border-radius:5mm;overflow:hidden;width:158mm;height:105.33mm}
.cena > img,.cena > svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cena .sl{position:absolute;width:6mm;height:6mm;margin:-3mm 0 0 -3mm;border-radius:50%;background:var(--laranja);border:.55mm solid #fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-marca);font-weight:800;font-size:9pt;color:var(--tinta)}
.cena .lg{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;font-family:var(--f-marca);font-weight:800;font-size:8.8pt;color:var(--tinta);line-height:1.2}
.cena .lg span{display:block;font-family:var(--f-texto);font-weight:500;font-size:6.4pt;color:#5E6B76}
.cena .troca{position:absolute;text-align:right;font-weight:800;font-size:7.3pt;line-height:1.25;color:var(--azul-txt)}
.cena .dn{position:absolute;left:39.06%;top:6.05%;width:30.6%;background:rgba(255,255,255,.96);border-radius:2.5mm;padding:2mm 3mm;display:flex;flex-direction:column;gap:1.4mm;font-size:7.3pt;color:var(--texto)}
.cena .dn div{display:flex;align-items:center;gap:2mm;white-space:nowrap}
.cena .dn b{color:var(--tinta)}
.cena .dn i{width:3mm;height:3mm;border-radius:50%;background:var(--laranja);flex-shrink:0}
.cena .dn i.lua{background:var(--azul-txt)}
.cena .ilus{position:absolute;left:1.6%;bottom:1.2%;font-size:5.3pt;color:#8A97A2}
.passos-v{display:flex;flex-direction:column;justify-content:space-between;height:100%;gap:3mm}
.passo-v{display:grid;grid-template-columns:9mm 1fr;gap:3.5mm;align-items:start;padding-bottom:3mm;border-bottom:1px solid var(--linha)}
.passo-v:last-child{border-bottom:0;padding-bottom:0}
.passo-v .n{font-family:var(--f-marca);font-weight:800;font-size:11pt;color:var(--tinta);background:var(--laranja);width:9mm;height:9mm;border-radius:50%;display:flex;align-items:center;justify-content:center}
.passo-v h3{font-size:11.5pt;font-weight:800;margin:.8mm 0 1mm}
.passo-v p{font-size:8.8pt;line-height:1.45}
.aviso{margin-top:5mm;display:flex;gap:4mm;align-items:flex-start;background:var(--laranja-claro);border-radius:4mm;padding:4mm 5.5mm;font-size:8.8pt;line-height:1.5}
.aviso .ic{color:var(--laranja-txt);width:5.5mm;height:5.5mm;margin-top:.3mm}
.aviso b{color:var(--tinta)}

/* ---------- 6. Equipamentos: vitrine azul ---------- */
.vitrine{background:var(--azul);border-radius:6mm;color:#fff;display:grid;grid-template-columns:1fr 1fr;position:relative;flex:1;min-height:0;overflow:hidden}
.vitrine .lado{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6mm;align-items:center;padding:7mm 8mm}
.vitrine .lado + .lado{border-left:1px solid rgba(255,255,255,.3)}
.vitrine .lado > img{height:62mm;width:auto;max-width:56mm;display:block}
.vitrine .qtd{font-family:var(--f-marca);font-weight:900;font-size:40pt;line-height:1;letter-spacing:-.03em}
.vitrine h3{color:#fff;font-size:14pt;font-weight:800;line-height:1.2;margin-top:2mm}
.vitrine .marca{font-size:8pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-top:3mm}
.vitrine .spec{font-size:8.8pt;opacity:.92;margin-top:1mm;line-height:1.45}
.vitrine .gar{display:inline-block;margin-top:3.5mm;background:var(--laranja);color:var(--tinta);font-weight:800;font-size:9pt;border-radius:99px;padding:1.3mm 3.5mm}
.vitrine .total{position:absolute;right:6mm;top:5mm;background:#fff;color:var(--azul-txt);font-family:var(--f-marca);font-weight:800;font-size:10pt;border-radius:99px;padding:1.2mm 4mm}
.vitrine .ilus{position:absolute;left:8mm;bottom:3mm;font-size:6.5pt;opacity:.7}
.base-eq{display:grid;grid-template-columns:1.2fr 1fr;gap:10mm;margin-top:6mm}
.itens4{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
.itens4 div{font-size:8.6pt;line-height:1.35}
.itens4 .bola{width:11mm;height:11mm;border-radius:50%;background:var(--azul-claro);color:var(--azul);display:flex;align-items:center;justify-content:center;margin-bottom:2mm}
.itens4 .bola .ic{width:5.5mm;height:5.5mm}
.itens4 b{display:block;color:var(--tinta)}
.base-eq .marcas{height:30mm;width:auto;max-width:100%;display:block}

/* ---------- 7. Retorno ---------- */
.graf7{position:relative;width:100%;margin:auto 0}
.graf7 svg{width:100%;height:auto;display:block}
.graf7 .pilula{position:absolute;background:var(--tinta);color:#fff;font-weight:800;font-size:10pt;border-radius:99px;padding:1.6mm 4.5mm;white-space:nowrap}
.graf7 .lucro{position:absolute;text-align:right;white-space:nowrap}
.graf7 .lucro b{display:block;font-family:var(--f-marca);font-weight:900;font-size:21pt;color:var(--azul-txt);line-height:1.05;letter-spacing:-.02em}
.graf7 .lucro span{font-size:9.5pt;font-weight:700;color:var(--texto)}
.faixa7{display:grid;grid-template-columns:1fr 1fr 1.5fr;border:1px solid var(--linha);border-radius:5mm;margin-top:5mm}
.faixa7 > div{padding:4mm 6mm;border-left:1px solid var(--linha);min-width:0}
.faixa7 > div:first-child{border-left:0}
.faixa7 .num{font-size:18pt;display:block;color:var(--azul-txt);margin-top:1mm;line-height:1.1}
.faixa7 span.s{font-size:8pt;color:var(--suave)}
.faixa7 .contas{display:flex;align-items:center;gap:4mm;margin-top:1mm}
.faixa7 .contas .num{color:var(--tinta)}
.faixa7 .contas .num.azul{color:var(--azul-txt)}
.faixa7 .contas .ic{width:6mm;height:6mm;color:var(--laranja)}

/* ---------- 8. Pagamento ---------- */
.pagto{display:grid;grid-template-columns:96mm minmax(0,1fr);grid-template-rows:auto 1fr;gap:5mm;flex:1;min-height:0}
.vista{grid-row:1 / span 2;background:var(--azul);border-radius:5mm;color:#fff;padding:6mm 7mm;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ============================================================
   CARREGANDO / ERRO / BARRA DE AÇÕES / OVERLAY
   ============================================================ */
#pdf-loading,#pdf-error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#f4f7fa;color:#3a4753;z-index:100;padding:24px;text-align:center}
body:not(.is-loading) #pdf-loading{display:none}
body:not(.is-error) #pdf-error{display:none}
body.is-loading #doc,body.is-error #doc{display:none}
#pdf-error h1{font-size:18pt;font-weight:800;color:var(--tinta)}
#pdf-error p{font-size:11pt;max-width:320px;line-height:1.5}
.spinner{width:36px;height:36px;border:3px solid #e2e8ee;border-top-color:var(--laranja);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#pdf-action-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:rgba(15,37,51,.92);backdrop-filter:blur(8px);border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:200}
.pdf-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:0;border-radius:999px;font-family:var(--f-texto);font-size:12pt;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .1s ease,background .2s ease}
.pdf-btn svg{width:16px;height:16px}
.pdf-btn:hover{transform:translateY(-1px)}
.pdf-btn-ghost{background:rgba(255,255,255,.08);color:#f1f5f9}
.pdf-btn-ghost:hover{background:rgba(255,255,255,.14)}
.pdf-btn-primary{background:var(--laranja);color:var(--tinta)}
.pdf-btn-wa{background:#16a34a;color:#fff}
#pdf-overlay{position:fixed;inset:0;z-index:300;background:rgba(15,37,51,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
#pdf-overlay.show{display:flex}
#pdf-overlay .box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#pdf-overlay .box h2{font-size:15pt;font-weight:800;color:var(--tinta);font-family:var(--f-marca)}
#pdf-overlay .box p{font-size:10.5pt;color:var(--suave);margin-top:6px;line-height:1.45}
#pdf-overlay .spinner{margin:0 auto 14px}
#pdf-overlay .actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
#pdf-overlay .pdf-btn{justify-content:center;width:100%}
#pdf-overlay .pdf-btn-ghost{background:#f1f5f9;color:var(--tinta)}
body.is-capturing #pdf-action-bar{display:none}
/* o html2canvas pinta a sombra por cima da folha inteira (fica cinza): sem sombras na captura */
body.is-capturing *{box-shadow:none!important}

/* Celular: as folhas encolhem para caber na tela (--page-zoom vem do JS).
   Só na tela — impressão e captura do PDF usam o tamanho real. */
@media screen{
  .pg{zoom:var(--page-zoom,1)}
  body.is-capturing .pg{zoom:1}
}
@media (max-width:480px){
  #pdf-action-bar{bottom:12px}
  .pdf-btn{padding:9px 14px;font-size:11pt}
}
@media print{
  html,body{background:#fff;padding-bottom:0!important}
  .pg{margin:0;box-shadow:none}
  .pg:last-of-type{page-break-after:auto;break-after:auto}
  #pdf-action-bar,#pdf-overlay{display:none!important}
}

<body class="is-loading">
<div id="pdf-loading"><div class="spinner"></div><p style="font-size:11pt;font-weight:600">Preparando proposta…</p></div>
<div id="pdf-error"><h1>Proposta indisponível</h1><p>Este link é inválido ou a proposta expirou. Entre em contato com o seu consultor.</p></div>
<div id="doc"></div>

<script>
(function () {
  var urlParams  = new URLSearchParams(window.location.search);
  var propostaId = urlParams.get('id');
  var D = null;          // dados da proposta já calculados (montarDados)
  var arquivoPdf = 'Proposta-Agil-Solar.pdf';
  var IMG = 'assets/img/proposta/';

  // ---------- utilitários ----------
  function isValidUUID(v) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v || '').trim());
  }
  function showError() {
    document.body.classList.remove('is-loading');
    document.body.classList.add('is-error');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function firstName(s) { return String(s || 'Cliente').trim().split(/\s+/)[0] || 'Cliente'; }
  // Nome cadastrado todo em maiúsculas vira "Thalyta Carolina" (de/da/do ficam minúsculos).
  function nomeBonito(s) {
    var t = String(s || '').trim();
    if (!t || t !== t.toUpperCase()) return t;
    return t.toLowerCase().replace(/(^|\s)(\S)/g, function (m, esp, l) { return esp + l.toUpperCase(); })
      .replace(/\s(D[aeo]s?|E)\s/g, function (m) { return m.toLowerCase(); });
  }
  function fmtTelefone(s) {
    var d = String(s || '').replace(/\D/g, '');
    if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2);
    if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
    if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    return String(s || '');
  }
  function whatsappUrl(tel, vendedor, numero) {
    var d = String(tel || '').replace(/\D/g, '');
    if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2);
    if (d.length !== 10 && d.length !== 11) return '';
    var msg = 'Olá, ' + firstName(vendedor || 'Consultor') + '! Vi a proposta'
      + (numero ? ' nº ' + numero : '') + ' da Ágil Solar e quero conversar.';
    return 'https://wa.me/55' + d + '?text=' + encodeURIComponent(msg);
  }
  function slug(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '');
  }
  var brl = function (v, d) { d = d == null ? 2 : d; return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }); };
  var int = function (v) { return Math.round(v || 0).toLocaleString('pt-BR'); };
  var din = function (v, d) { return '<span class="rs">R$</span>' + brl(v, d); };
  var kwpFmt = function (v) { return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwFmt = function (v) { return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 }); };

  // TIR de 25 anos: investimento hoje e a mesma economia todo ano (sem reajuste, como o resto da conta).
  function tir() {
    if (!(D.economiaAnual > 0) || !(D.preco > 0)) return 0;
    var lo = 0, hi = 5;
    for (var i = 0; i < 100; i++) {
      var r = (lo + hi) / 2, vpl = -D.preco;
      for (var k = 1; k <= 25; k++) vpl += D.economiaAnual / Math.pow(1 + r, k);
      if (vpl > 0) lo = r; else hi = r;
    }
    return lo * 100;
  }

  // ---------- dados ----------
  // Placa e inversor: do kit_snapshot (kits) ou da proposta personalizada.
  function equipamento(snap, nomeCustom, qtdCustom) {
    var nome = (snap && snap.nome) || nomeCustom || '';
    if (!nome) return null;
    var potW = Number(snap && snap.potencia_wp) || 0;
    if (!potW) { var m = String(nome).match(/(\d{3,5})\s*W\b/i); if (m) potW = Number(m[1]); }
    return {
      nome: nome,
      marca: (snap && snap.marca) || '',
      qtd: Number((snap && snap.qtd) || qtdCustom) || null,
      potW: potW || null,
    };
  }

  function montarDados(p) {
    var num = calcularNumerosProposta(p);
    var temGeracao = num.geracao > 0;
    var mensal = temGeracao ? calcularGeracaoMensal(num.geracao, p.cidade_hsp_mensal, p.cidade_hsp_anual) : { valores: [], fonte: '' };
    var valores = mensal.valores.map(function (v) { return Math.round(v); });
    var modulo = equipamento(p.kit_modulo, p.custom_modulo_nome, p.custom_modulo_qty);
    var inversor = equipamento(p.kit_inversor, p.custom_inversor_nome, p.custom_inversor_qty);
    if (inversor && !inversor.qtd) inversor.qtd = 1;
    var criada = new Date(p.created_at);
    var validade = propostaValidade(p.created_at);
    var precoDe = !num.personalizada && Number(p.kit_list_price) > num.preco ? Number(p.kit_list_price) : null;
    var cidade = formatarCidadeUF(p.cliente_cidade);
    var consumo = Number(p.consumo_medio) > 0 ? Number(p.consumo_medio) : null;

    return {
      numero: p.numero || '—',
      data: criada.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }),
      dataCurta: criada.toLocaleDateString('pt-BR'),
      validade: validade.toLocaleDateString('pt-BR') + ' às ' + validade.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
      cliente: nomeBonito(p.cliente_nome) || 'Cliente',
      primeiro: firstName(nomeBonito(p.cliente_nome)),
      cidade: cidade,
      consumo: consumo,
      consultor: {
        nome: p.vendedor_nome || 'Consultor Ágil Solar',
        // sem telefone do consultor, vale o da unidade
        tel: fmtTelefone(p.vendedor_telefone || p.franquia_telefone),
        wa: whatsappUrl(p.vendedor_telefone || p.franquia_telefone, p.vendedor_nome, p.numero),
        unidade: p.franquia_nome || 'Ágil Solar',
      },
      empresa: {
        cnpj: p.franquia_cnpj || '',
        end: String(p.franquia_endereco || p.franquia_cidade || '').replace(/\s+([,.;])/g, '$1').replace(/\s{2,}/g, ' ').trim(),
        site: p.franquia_site || 'agilsolar.com',
        email: p.franquia_email || '',
        insta: '@agilsolar',
      },
      linkProposta: linkProposta({ id: propostaId, codigo: p.codigo }),
      kit: num.nome || p.kit_nome || 'Sistema fotovoltaico',
      modulo: modulo,
      inversor: inversor,
      telhado: p.estrutura_nome || '',
      garantiaPlacas: Number(p.franquia_garantia_paineis_anos) || 25,
      garantiaInversor: Number(p.franquia_garantia_inversor_anos) || 10,
      kwp: num.potencia,
      preco: num.preco,
      precoDe: precoDe,
      temGeracao: temGeracao,
      fonteCidade: mensal.fonte === 'cidade',
      geracao: num.geracao,
      mensal: valores,
      geracaoAno: valores.reduce(function (a, b) { return a + b; }, 0),
      economiaMensal: num.economiaMensal,
      economiaAnual: num.economiaAnual,
      economia25: num.economia25Anos,
      contaSem: Math.round(num.faturaIdeal * 100) / 100,
      meses: num.mesesPayback,
      payback: num.payback,
      area: modulo && modulo.qtd ? modulo.qtd * 2.6 : num.potencia * 4.3,
      co2: num.co2Toneladas,
      arvores: num.arvores,
      carro: num.carroAnos,
      cartaoTaxas: p.cartao_taxas,
      notaPagamento: p.custom_payment_note || '',
      notaComercial: p.custom_commercial_note || '',

  // ---------- gráficos (SVG só com formas e rótulos pequenos) ----------
  function graficoGeracaoConsumo() {
    var W = 640, H = 330, L = 40, R = 8, T = 26, B = 28;
    var topo = Math.max.apply(null, D.mensal.concat([D.consumo || 0]));
    var passo = topo > 2000 ? 1000 : topo > 1000 ? 500 : 200;
    var max = Math.ceil(topo * 1.12 / passo) * passo || passo;
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var bw = (W - L - R) / 12, g = '';
    for (var v = 0; v <= max; v += passo) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E2E8EE"/><text x="' + (L - 7) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10.5" fill="#8A97A2">' + int(v) + '</text>';
    D.mensal.forEach(function (val, i) {
      var x = L + i * bw + bw * 0.16, w = bw * 0.68;
      var claro = D.consumo && val < D.consumo;
      g += '<rect x="' + x + '" y="' + y(val) + '" width="' + w + '" height="' + (y(0) - y(val)) + '" rx="4" fill="' + (claro ? '#8ACDEE' : '#008FD4') + '"/>';
      g += '<text x="' + (x + w / 2) + '" y="' + (y(val) - 6) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F2533">' + int(val) + '</text>';
      g += '<text x="' + (x + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#6B7883">' + D.nomesMes[i] + '</text>';
    });
    if (D.consumo) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(D.consumo) + '" y2="' + y(D.consumo) + '" stroke="#FAA519" stroke-width="3" stroke-dasharray="9 6"/>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" font-family="Plus Jakarta Sans, Arial, sans-serif">' + g + '</svg>';
  }

  // Saldo acumulado em 25 anos. A etiqueta do retorno e o lucro final vão em HTML por cima
  // (posição em % do desenho), para sair com a fonte certa no PDF.
  function graficoRetorno() {
    var W = 1000, H = 300, L = 56, R = 8, T = 16, B = 26;
    var anos = []; for (var k = 0; k <= 25; k++) anos.push(-D.preco + D.economiaAnual * k);
    var passo = anos[25] > 400000 ? 100000 : anos[25] > 200000 ? 50000 : 20000;
    var max = Math.ceil(anos[25] / passo) * passo, min = -Math.ceil(D.preco / passo) * passo;
    var y = function (v) { return T + (H - T - B) * (max - v) / (max - min); };
    var bw = (W - L - R) / 26, g = '';
    for (var v = min; v <= max; v += passo) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (v === 0 ? '#9AA8B4' : '#E2E8EE') + '"' + (v === 0 ? ' stroke-width="1.4"' : '') + '/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#8A97A2">' + (v === 0 ? '0' : (v / 1000).toLocaleString('pt-BR') + ' mil') + '</text>';
    anos.forEach(function (val, k) {
      var x = L + k * bw + bw * 0.18, w = bw * 0.64;
      var top = Math.min(y(val), y(0)), h = Math.abs(y(val) - y(0));
      g += '<rect x="' + x + '" y="' + top + '" width="' + w + '" height="' + Math.max(h, 1) + '" rx="3" fill="' + (val < 0 ? '#FAA519' : '#008FD4') + '"/>';
      if (k % 5 === 0) g += '<text x="' + (x + w / 2) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="11.5" fill="#6B7883">' + (k === 0 ? 'Hoje' : 'Ano ' + k) + '</text>';
    });
    var xp = L + Math.min(D.meses / 12, 25) * bw + bw * 0.5;
    g += '<line x1="' + xp + '" x2="' + xp + '" y1="' + (T + 30) + '" y2="' + y(0) + '" stroke="#0F2533" stroke-width="1.6" stroke-dasharray="4 4"/>';
    g += '<circle cx="' + xp + '" cy="' + y(0) + '" r="6" fill="#0F2533"/>';
    var xf = L + 19 * bw;
    var pct = function (a, total) { return (a / total * 100).toFixed(2) + '%'; };
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" font-family="Plus Jakarta Sans, Arial, sans-serif">' + g + '</svg>'
      + '<div class="pilula" style="left:' + pct(xp - 14, W) + ';top:' + pct(T, H) + '">Investimento pago em ' + esc(D.payback) + '</div>'
      + '<div class="lucro" style="right:' + pct(W - xf, W) + ';top:' + pct(y(anos[25]) - 14, H) + '"><b>R$ ' + int(anos[25]) + '</b><span>de lucro em 25 anos</span></div>';
  }

  // QR da proposta online e do WhatsApp do consultor (imagem data: — o CSP libera).
  var qrPronto = Promise.resolve();
  async function gerarQrs() {
    var boxes = document.querySelectorAll('[data-qr]');
    if (!boxes.length) return;
    try {
      await carregarScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js', function () { return typeof window.qrcode === 'function'; });
      await Promise.all(Array.prototype.map.call(boxes, function (box) {
        var qr = window.qrcode(0, 'M'); qr.addData(box.getAttribute('data-qr')); qr.make();
        var img = new Image(); img.alt = ''; img.src = qr.createDataURL(8, 0);
        box.appendChild(img);
        return new Promise(function (ok) { img.onload = ok; img.onerror = ok; });
      }));
    } catch (err) {
      console.warn('[proposta-pdf] QR indisponível', err);
      Array.prototype.forEach.call(boxes, function (b) { b.style.display = 'none'; });
    }
  }

  // O html2canvas desenha o SVG como imagem e perde o "currentColor": grava a cor de cada ícone.
  function fixarCorIcones() {
    document.querySelectorAll('svg.ic').forEach(function (s) { s.setAttribute('stroke', getComputedStyle(s).color); });
  }

  // Áreas clicáveis no PDF: cada <a data-pdf-link> vira um link do jsPDF na mesma posição.
  function adicionarLinksPdf(pdf, pagina, mmPorPx) {
    var base = pagina.getBoundingClientRect();
    pagina.querySelectorAll('a[data-pdf-link]').forEach(function (a) {
      var r = a.getBoundingClientRect();
      if (!r.width || !r.height || !a.href) return;
      pdf.link((r.left - base.left) * mmPorPx, (r.top - base.top) * mmPorPx, r.width * mmPorPx, r.height * mmPorPx, { url: a.href });
    });
  }

  // Celular: encolhe as folhas A4 deitadas para caber na largura.
  var LARGURA_A4_PX = 297 * 96 / 25.4; // ~1123px
  function ajustarZoom() {
    var largura = document.documentElement.clientWidth;
    if (!largura) return;
    var z = Math.max(0.25, Math.min(1, (largura - 16) / LARGURA_A4_PX));
    document.documentElement.style.setProperty('--page-zoom', z.toFixed(4));
  }
  function isMobile() { return window.matchMedia('(pointer: coarse)').matches || window.innerWidth < 768; }

  var ICON_BACK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
  var ICON_DOWN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
  var ICON_PRINT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>';
  var ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';

  function injetarActionBar() {
    var bar = document.createElement('div');
    bar.id = 'pdf-action-bar';
    bar.innerHTML = '<button id="pdf-back-btn" type="button" class="pdf-btn pdf-btn-ghost">' + ICON_BACK + '<span>Voltar</span></button>'
      + (isMobile() ? '' : '<button id="pdf-print-btn" type="button" class="pdf-btn pdf-btn-ghost">' + ICON_PRINT + '<span>Imprimir</span></button>')
      + '<button id="pdf-save-btn" type="button" class="pdf-btn pdf-btn-primary">' + ICON_DOWN + '<span>Baixar PDF</span></button>';
    document.body.appendChild(bar);
    document.getElementById('pdf-back-btn').addEventListener('click', function () {
      if (window.history.length > 1) window.history.back(); else window.close();
    });
    var printBtn = document.getElementById('pdf-print-btn');
    if (printBtn) printBtn.addEventListener('click', async function () {
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      await qrPronto;
      window.print();

    document.getElementById('pdf-save-btn').addEventListener('click', gerarPdf);

  function injetarOverlay() {
    var ov = document.createElement('div');
    ov.id = 'pdf-overlay';
    ov.innerHTML = '<div class="box" id="pdf-overlay-box"></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function (e) { if (e.target === ov) fecharOverlay(); });
  }
  function overlay(html) {
    document.getElementById('pdf-overlay-box').innerHTML = html;
    document.getElementById('pdf-overlay').classList.add('show');
  }
  function fecharOverlay() { document.getElementById('pdf-overlay').classList.remove('show'); }

  function carregarScript(src, pronto) {
    if (pronto()) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.onload = resolve;
      s.onerror = function () { reject(new Error('Falha ao carregar ' + src)); };
      document.head.appendChild(s);
    });
  }

  var pdfGerado = null; // { blob, file }

  async function gerarPdf() {
    if (pdfGerado) { mostrarPronto(); return; }
    overlay('<div class="spinner"></div><h2>Gerando PDF…</h2><p>Isso leva alguns segundos.</p>');
    try {
      await Promise.all([
        carregarScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', function () { return !!window.html2canvas; }),
        carregarScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', function () { return !!(window.jspdf && window.jspdf.jsPDF); })
      ]);
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
      await qrPronto;
      fixarCorIcones();

      // Captura no tamanho real (sem o zoom do celular). Folha A4 deitada: 297 × 210 mm.
      document.body.classList.add('is-capturing');
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape', compress: true });
      var paginas = document.querySelectorAll('.pg');
      for (var i = 0; i < paginas.length; i++) {
        var canvas = await window.html2canvas(paginas[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 1200, logging: false });
        var img = canvas.toDataURL('image/jpeg', 0.9);
        if (i > 0) pdf.addPage('a4', 'landscape');
        pdf.addImage(img, 'JPEG', 0, 0, 297, 210);
        adicionarLinksPdf(pdf, paginas[i], 297 / paginas[i].getBoundingClientRect().width);
      }
      document.body.classList.remove('is-capturing');

      var blob = pdf.output('blob');
      var file = null;
      try { file = new File([blob], arquivoPdf, { type: 'application/pdf' }); } catch (e) {}
      pdfGerado = { blob: blob, file: file };
      if (typeof captureEvent === 'function') captureEvent('public_proposal_pdf_generated', {});
      mostrarPronto();
    } catch (err) {
      document.body.classList.remove('is-capturing');
      console.error('[proposta-pdf] Falha ao gerar PDF', err);
      overlay('<h2>Não foi possível gerar o PDF</h2>'
        + '<p>Verifique sua conexão e tente novamente.' + (isMobile() ? '' : ' Você também pode usar o botão Imprimir e escolher "Salvar como PDF".') + '</p>'
        + '<div class="actions"><button type="button" class="pdf-btn pdf-btn-primary" id="pdf-retry">Tentar de novo</button>'
        + '<button type="button" class="pdf-btn pdf-btn-ghost" id="pdf-close">Fechar</button></div>');
      document.getElementById('pdf-retry').onclick = gerarPdf;
      document.getElementById('pdf-close').onclick = fecharOverlay;
    }
  }

  function podeCompartilhar() {
    return !!(pdfGerado && pdfGerado.file && navigator.canShare && navigator.share && navigator.canShare({ files: [pdfGerado.file] }));
  }

  // O compartilhamento precisa de um toque "fresco" do usuário (iOS recusa
  // share() depois de um await longo), por isso ele vem num segundo botão.
  function mostrarPronto() {
    var share = podeCompartilhar();
    overlay('<h2>PDF pronto</h2><p>' + esc(arquivoPdf) + '</p><div class="actions">'
      + (share ? '<button type="button" class="pdf-btn pdf-btn-wa" id="pdf-share">' + ICON_SHARE + '<span>Compartilhar</span></button>' : '')
      + '<button type="button" class="pdf-btn ' + (share ? 'pdf-btn-ghost' : 'pdf-btn-primary') + '" id="pdf-download">' + ICON_DOWN + '<span>Salvar no aparelho</span></button>'
      + '<button type="button" class="pdf-btn pdf-btn-ghost" id="pdf-close">Fechar</button></div>');
    if (share) {
      document.getElementById('pdf-share').onclick = async function () {
        try { await navigator.share({ files: [pdfGerado.file], title: 'Proposta Ágil Solar' }); }
        catch (e) { if (e && e.name !== 'AbortError') baixarPdf(); }
      };
    }
    document.getElementById('pdf-download').onclick = baixarPdf;
    document.getElementById('pdf-close').onclick = fecharOverlay;
  }

  function baixarPdf() {
    var url = URL.createObjectURL(pdfGerado.blob);
    var a = document.createElement('a');
    a.href = url; a.download = arquivoPdf;
    document.body.appendChild(a); a.click(); a.remove();
    // Navegadores embutidos (WhatsApp/Instagram) ignoram download: abre o PDF.
    var ua = navigator.userAgent || '';
    if (/FBAN|FBAV|Instagram|WhatsApp|; wv\)/i.test(ua)) window.open(url, '_blank');
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
})();
</script>
